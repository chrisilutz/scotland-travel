# GitLab Pages: statische Dateien ohne Build-Step nach public/ kopieren.
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - cp -r index.html agenda.html map.html fotos.html sightseeing.html essen.html links.html sw.js manifest.webmanifest css js icons public/
    - '[ -f photos.json ] && cp photos.json public/ || true'
    - '[ -d photos ] && cp -r photos public/ || true'
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
