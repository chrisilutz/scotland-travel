[build]
  publish = "."

# Statische Seite ohne Build-Step — Netlify liefert /agenda, /map, /sightseeing
# und /links automatisch aus den gleichnamigen .html-Dateien aus ("Pretty URLs").

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
